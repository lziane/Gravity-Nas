<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récupération - GravityNAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #4f46e5; --bg: #0f172a; --panel: rgba(255, 255, 255, 0.03); --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); }
        .glass-panel { background: var(--panel); backdrop-filter: blur(40px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md p-10 glass-panel rounded-[2.5rem] shadow-2xl">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-xl shadow-amber-500/20">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h1 class="text-2xl font-black tracking-tight">Accès Maître (God Mode)</h1>
            <p class="text-xs mt-3 opacity-50">La récupération par e-mail est désactivée pour plus de sécurité.</p>
        </div>

        <div class="space-y-6">
            <div class="p-5 rounded-2xl bg-white/5 border border-white/10">
                <label class="text-[10px] font-black uppercase tracking-widest opacity-50 block mb-3">Procédure de secours</label>
                <p class="text-[12px] leading-relaxed mb-4">Pour réinitialiser votre accès, lancez cette commande dans le terminal de votre serveur :</p>
                <code class="block bg-black/40 p-3 rounded-xl text-indigo-400 text-xs font-mono border border-white/5 break-all">
                    python main.py --reset [votre_nom]
                </code>
            </div>

            <div class="text-center pt-4">
                <a href="/login" class="text-[10px] font-black uppercase tracking-widest opacity-30 hover:opacity-100 transition-opacity">Retour à la connexion</a>
            </div>
        </div>
    </div>
</body>
</html>
