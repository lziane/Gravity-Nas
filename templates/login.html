<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - GravityNAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --accent: #4f46e5;
            --bg: #0f172a;
            --panel: rgba(255, 255, 255, 0.03);
            --text: #ffffff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            transition: background 0.4s ease;
        }
        .glass-panel {
            background: var(--panel);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #snake-overlay {
            position: fixed; inset: 0; z-index: 99999;
            pointer-events: none;
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            width: 100vw; height: 100vh;
        }
        .snake-bar {
            background: var(--accent);
            width: 100%; height: 100%;
            transform: scaleX(0);
            margin-top: -1px; height: calc(100% + 2px);
            box-shadow: 0 0 100px rgba(0,0,0,0.5), 0 0 40px rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
    </style>
    <script>
        (function() {
            const theme = localStorage.getItem('gravity_theme') || 'dark';
            const config = {
                light: { accent: '#4f46e5', bg: '#f8fafc', panel: 'rgba(255,255,255,0.8)', text: '#0f172a' },
                dark: { accent: '#818cf8', bg: '#0f172a', panel: 'rgba(255,255,255,0.03)', text: '#ffffff' },
                cyberpunk: { accent: '#ff2d6b', bg: '#0a0a12', panel: 'rgba(20,20,35,0.9)', text: '#f0e68c' },
                matrix: { accent: '#00ff41', bg: '#000800', panel: 'rgba(0,18,0,0.9)', text: '#00ff41' },
                apple: { accent: '#007aff', bg: '#f5f5f7', panel: 'rgba(255,255,255,0.72)', text: '#1d1d1f' },
                minimal: { accent: '#111111', bg: '#fafafa', panel: 'rgba(255,255,255,1)', text: '#111111' }
            };
            const c = config[theme] || config.dark;
            const r = document.documentElement;
            r.style.setProperty('--accent', c.accent);
            r.style.setProperty('--bg', c.bg);
            r.style.setProperty('--panel', c.panel);
            r.style.setProperty('--text', c.text);
            if (theme === 'minimal' || theme === 'light' || theme === 'apple') {
                r.classList.add('theme-light');
            }
        })();
    </script>
</head>
<body class="min-h-screen flex items-center justify-center relative">
    <!-- Snake Overlay Container -->
    <div id="snake-overlay">
        <div class="snake-bar" style="transform-origin: left; transform: scaleX(1);"></div>
        <div class="snake-bar" style="transform-origin: right; transform: scaleX(1);"></div>
        <div class="snake-bar" style="transform-origin: left; transform: scaleX(1);"></div>
    </div>

    <!-- Login Panel -->
    <div id="login-panel" class="relative z-10 w-full max-w-md p-10 glass-panel rounded-[2.5rem] mx-4 transition-all duration-300">
        <div class="flex flex-col items-center mb-10">
            <div class="w-20 h-20 bg-[var(--accent)] rounded-[2rem] flex items-center justify-center mb-6 shadow-xl shadow-[var(--accent)]/20">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-center" style="color: var(--text)">GravityNAS</h1>
            <p class="text-sm mt-2 text-center opacity-40" style="color: var(--text)">Identifiez-vous pour continuer</p>
        </div>

        <form id="login-form" class="space-y-5">
            <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-widest ml-1 opacity-50" style="color: var(--text)">Identifiant</label>
                <input type="text" name="username" id="username" required autocomplete="username"
                       placeholder="alexandre@gravity.io"
                       class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 focus:outline-none focus:border-[var(--accent)]/50 transition-all font-medium" style="color: var(--text)">
            </div>
            <div class="space-y-2">
                <label class="text-[10px] font-bold uppercase tracking-widest ml-1 opacity-50" style="color: var(--text)">Mot de passe</label>
                <input type="password" name="password" id="password" required autocomplete="current-password"
                       placeholder="••••••••"
                       class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 focus:outline-none focus:border-[var(--accent)]/50 transition-all font-medium" style="color: var(--text)">
            </div>
            
            <div id="error-msg" class="hidden text-red-400 text-xs font-bold text-center bg-red-500/10 py-3 rounded-xl border border-red-500/20"></div>

            <button type="submit" id="submit-btn"
                    class="w-full bg-[var(--accent)] hover:brightness-110 text-white font-bold py-4 rounded-2xl transition-all flex items-center justify-center gap-3 mt-8 active:scale-95 shadow-lg shadow-[var(--accent)]/20">
                <span id="btn-text">Authentification</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="/forgot-password" class="text-xs font-bold opacity-30 hover:opacity-100 hover:text-[var(--accent)] transition-colors uppercase tracking-widest" style="color: var(--text)">Accès perdu ?</a>
        </div>
    </div>

    <script>
        const bars = document.querySelectorAll('.snake-bar');

        // Reveal Logic (On Page Load)
        (function() {
            bars.forEach((bar, i) => {
                const isEven = (i % 2 === 1);
                bar.animate([
                    { transform: 'translateX(0)', opacity: 1 },
                    { transform: `translateX(${isEven ? '-100%' : '100%'})`, opacity: 1 }
                ], {
                    duration: 650,
                    delay: 200 + (i * 80),
                    easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                    fill: 'forwards'
                });
            });
            setTimeout(() => document.getElementById('snake-overlay').style.display = 'none', 1500);
        })();

        async function triggerSnakeFill(targetUrl) {
            const overlay = document.getElementById('snake-overlay');
            overlay.style.display = 'grid';

            // Speed up fill: 600ms
            bars.forEach((bar, i) => {
                bar.style.transformOrigin = (i % 2 === 1) ? 'right' : 'left';
                bar.animate([
                    { transform: 'scaleX(0)' },
                    { transform: 'scaleX(1)' }
                ], {
                    duration: 650,
                    delay: i * 80,
                    easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                    fill: 'forwards'
                });
            });

            // Redirect faster: 850ms
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 850);
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const errDiv = document.getElementById('error-msg');
            
            btnText.innerHTML = '<svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
            btn.classList.add('opacity-80', 'cursor-wait');
            errDiv.classList.add('hidden');

            const formData = new FormData(e.target);
            try {
                const res = await fetch('/login', { method: 'POST', body: formData, redirect: 'follow' });

                if (res.ok && !res.url.includes('error=1')) {
                    document.getElementById('login-panel').style.opacity = '0';
                    triggerSnakeFill(res.url);
                } else {
                    btnText.innerText = 'Authentification';
                    btn.classList.remove('opacity-80', 'cursor-wait');
                    errDiv.textContent = 'Accès refusé. Vérifiez vos identifiants.';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                window.location.reload();
            }
        });

        if (new URLSearchParams(window.location.search).get('error')) {
            const errDiv = document.getElementById('error-msg');
            errDiv.textContent = 'Session expirée ou identifiants invalides.';
            errDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
