<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification MFA - GravityNAS</title>
    <link rel="stylesheet" href="/static/style.css?v=2.7">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <main class="glass-panel w-full max-w-md rounded-2xl p-8">
        <h1 class="text-xl font-bold mb-2">Vérification en deux étapes</h1>
        <p class="text-sm opacity-70 mb-6">Saisissez le code affiché par votre application d’authentification.</p>
        <form action="/login/mfa" method="post" class="space-y-4">
            <input type="hidden" name="t" value="{{ token }}">
            <label class="block text-sm" for="code">Code à 6 chiffres</label>
            <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required class="input w-full" autofocus>
            <button type="submit" class="btn-primary w-full py-3 rounded-lg">Valider</button>
        </form>
    </main>
</body>
</html>
