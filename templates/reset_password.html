<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#f9fafb">
    <link rel="manifest" href="/static/manifest.json">
    <title>Nouveau mot de passe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .input-subtle { border: 1px solid #e5e7eb; transition: border-color 0.15s, box-shadow 0.15s; }
        .input-subtle:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .btn-primary { background-color: #0066ff; transition: background-color 0.15s; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-sm bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600 mx-auto mb-4">
                <i class="fas fa-key text-xl"></i>
            </div>
            <h1 class="text-xl font-semibold tracking-tight text-gray-900">Nouveau Mot de passe</h1>
        </div>

        {% if error %}
        <div class="text-red-600 text-xs font-medium bg-red-50 p-3 rounded-lg border border-red-100 mb-4">
            Le lien est invalide ou a expiré (durée max: 15 minutes).
        </div>
        <a href="/forgot-password" class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg text-center block sm:text-sm">Demander un autre lien</a>
        {% else %}
        <form action="/reset-password" method="post" class="space-y-5">
            <input type="hidden" name="token" value="{{ token }}">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-2">Nouveau mot de passe</label>
                <div class="relative">
                    <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="password" name="new_password" required minlength="8"
                           placeholder="8 caractères minimum"
                           class="w-full pl-9 pr-3 py-2.5 rounded-lg input-subtle bg-gray-50 text-gray-900 sm:text-sm">
                </div>
            </div>

            <button type="submit" 
                    class="w-full py-2.5 btn-primary text-white rounded-lg font-medium shadow-sm flex items-center justify-center space-x-2 sm:text-sm">
                <span>Enregistrer</span>
            </button>
        </form>
        {% endif %}
    </div>
</body>
</html>
