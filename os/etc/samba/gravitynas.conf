[global]
   workgroup = WORKGROUP
   server string = GravityNAS
   netbios name = GravityNAS
   security = user
   map to guest = Never
   min protocol = SMB2
   server min protocol = SMB2
   dns proxy = no
   logging = file
   log file = /var/log/samba/%m.log
   max log size = 1000
   load printers = no
   printing = bsd
   disable spoolss = yes

[homes]
   comment = Espace personnel GravityNAS
   browseable = no
   read only = no
   path = /var/lib/gravitynas/storage/%S
   valid users = %S
   force group = gravitynas_users
   inherit acls = yes
   create mask = 0660
   directory mask = 0770
   hide files = /.nas_encryption.key/.nas_metadata.db/.thumbnails/
   veto files = /.nas_encryption.key/.nas_metadata.db/
