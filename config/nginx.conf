# ╔══════════════════════════════════════════════════════════╗
# ║  GravityNAS — Configuration Nginx (Reverse Proxy)       ║
# ║  Accès via URL custom : http://nas.local ou domaine      ║
# ╚══════════════════════════════════════════════════════════╝
#
# 1. Copier ce fichier :
#      sudo cp gravitynas.nginx.conf /etc/nginx/sites-available/gravitynas
#      sudo ln -s /etc/nginx/sites-available/gravitynas /etc/nginx/sites-enabled/
#      sudo rm /etc/nginx/sites-enabled/default   # Optionnel
#
# 2. Tester la syntaxe :
#      sudo nginx -t
#
# 3. Recharger :
#      sudo systemctl reload nginx
#
# 4. Pour un nom personnalisé (ex: nas.local) :
#    - Sur le Pi : sudo hostnamectl set-hostname gravitynas
#    - Sur chaque PC du réseau, ajouter dans le fichier hosts :
#        Windows : C:\Windows\System32\drivers\etc\hosts
#        Linux/Mac : /etc/hosts
#      La ligne :  <IP_DU_PI>  nas.local
#
# ──────────────────────────────────────────────────────────

# Limite les uploads volumineux à 10 Go (adapter si besoin)
client_max_body_size 10G;

# Cache des types MIME et optimisations (Géré globalement par Nginx par défaut)
# sendfile          on;
# tcp_nopush        on;
# tcp_nodelay       on;


upstream gravitynas_backend {
    server 127.0.0.1:8000;
    keepalive 4;   # Faible car Pi a peu de RAM
}

server {
    listen 80;
    # ── Remplace par ton nom de domaine ou IP ──
    server_name  nas.local  _;

    # Sécurité : cacher la version Nginx
    server_tokens off;

    # ── Compression Gzip (essentiel sur Pi avec WiFi lent) ──
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_comp_level  4;        # Bon ratio perf/ratio sur ARM
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        image/svg+xml;

    # ── Fichiers statiques servies directement par Nginx ──
    # (beaucoup plus rapide que FastAPI pour les fichiers CSS/JS/images)
    location /static/ {
        alias /opt/gravitynas/current/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Proxy vers FastAPI ──
    location / {
        proxy_pass http://gravitynas_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support (pour futures fonctionnalités temps réel)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts généreux pour les gros uploads
        proxy_read_timeout    600;
        proxy_send_timeout    600;
        proxy_connect_timeout 30;

        # Buffer adapté au Pi (peu de RAM)
        proxy_buffering       off;
        proxy_request_buffering off;
    }

    # ── Pages d'erreur custom (optionnel) ──
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# ──────────────────────────────────────────────────────────
# ⚡ HTTPS avec Certbot (optionnel mais recommandé)
#
# Pour activer HTTPS gratuitement avec Let's Encrypt :
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d ton-domaine.com
#
# Certbot modifiera automatiquement ce fichier pour y
# ajouter les directives SSL.
# ──────────────────────────────────────────────────────────
